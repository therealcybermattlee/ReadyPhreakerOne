# CrunchWhistle firewall — default-deny inbound; open only the payphone stack.
# Applied with deploy/firewall.sh. Loopback and all outbound stay open so the
# daemon, Ollama, and Asterisk keep talking internally.

set block-policy drop
set skip on lo0

# return traffic for anything the mini initiates
pass out quick all keep state

# ICMP (ping / path diagnostics)
pass in quick proto icmp all

# SSH management — key-auth only; source not scoped because it arrives via router NAT
pass in quick proto tcp to port 22 keep state

# SIP signalling from the ATA on the isolated phone island (en0)
pass in quick proto udp from 192.168.50.0/24 to port 5060 keep state

# RTP media from the phone island
pass in quick proto udp from 192.168.50.0/24 to port 10000:10100 keep state

# everything else inbound
block in all
