# /etc/newsyslog.d/wopr.conf — rotate CrunchWhistle logs at 10 MB, keep 7, compress
# logfilename                      [owner:group]   mode count size when  flags [/pid_file] [sig_num]
/opt/wopr/log/wopr.log             __USER__:staff  644  7     10240 *     J
/opt/wopr/log/ollama.log           __USER__:staff  644  7     10240 *     J
/opt/wopr/log/asterisk-launchd.log __USER__:staff  644  7     10240 *     J
