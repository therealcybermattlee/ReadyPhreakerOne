; CrunchWhistle — load everything that builds, but insist on what the daemon needs and drop noise.
[modules]
autoload = yes

; hard requirements: Asterisk refuses to start without these
require = res_audiosocket.so
require = app_audiosocket.so
require = chan_pjsip.so
require = func_uuid.so
require = codec_ulaw.so

; unneeded subsystems (missing modules in this list are harmless)
noload = chan_sip.so
noload = cdr_csv.so
noload = cdr_custom.so
noload = cdr_manager.so
noload = cdr_syslog.so
noload = cel_custom.so
noload = cel_manager.so
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
noload = app_voicemail.so
noload = app_voicemail_imap.so
noload = app_voicemail_odbc.so
noload = res_config_sqlite3.so
noload = res_config_curl.so
noload = res_calendar.so
noload = res_phoneprov.so
noload = res_pjsip_phoneprov_provider.so
noload = res_ari.so
noload = res_stasis.so
noload = res_http_websocket.so
noload = res_websocket_client.so
noload = res_pjsip_publish_asterisk.so
noload = res_speech_aeap.so
noload = res_stasis_snoop.so
noload = res_stasis_playback.so
noload = res_stasis_answer.so
noload = res_stasis_recording.so
noload = res_stasis_device_state.so
noload = cdr_sqlite3_custom.so
noload = cel_sqlite3_custom.so
noload = res_config_ldap.so
; NOTE: chan_pjsip requires res_pjsip_pubsub (and res_pjsip_outbound_publish) — never noload them.
