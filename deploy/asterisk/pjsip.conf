; CrunchWhistle — one endpoint: the Grandstream HT802 FXS port with the payphone on it.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[payphone]
type = endpoint
context = payphone
disallow = all
allow = ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
auth = payphone-auth
aors = payphone

[payphone-auth]
type = auth
auth_type = userpass
username = payphone
#include pjsip_secret.conf

[payphone]
type = aor
max_contacts = 1
qualify_frequency = 60
