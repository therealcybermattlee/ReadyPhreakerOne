; CrunchWhistle dialplan
[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]
WOPR_HOSTPORT = 127.0.0.1:9092
RECDIR = /opt/wopr/recordings

[payphone]
; 2600 → WOPR. Whistle after the silence.
exten => 2600,1,NoOp(CrunchWhistle: 2600 -> WOPR from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(REC=${RECDIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID})
 same => n,MixMonitor(${REC}.wav,r(${REC}-caller.wav))
 same => n,Set(WOPR_UUID=${UUID()})
 same => n,AudioSocket(${WOPR_UUID},${WOPR_HOSTPORT})
 same => n,Hangup()

; 2605 = WOPR's callback entry. The sentinel UUID tells the daemon this is a callback,
; so WOPR greets immediately instead of waiting for a whistle. Dialed by the daemon via
; "channel originate PJSIP/payphone extension 2605@payphone" after a thermonuclear-war hangup.
exten => 2605,1,NoOp(CrunchWhistle: WOPR calls back)
 same => n,Answer()
 same => n,Set(REC=${RECDIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}-cb)
 same => n,MixMonitor(${REC}.wav,r(${REC}-caller.wav))
 same => n,AudioSocket(ca11bac0-0000-4000-8000-000000000000,${WOPR_HOSTPORT})
 same => n,Hangup()

; 2606 = WOPR's WIN callback entry (caller won the flag then hung up). Its sentinel UUID makes
; the daemon greet with the taunt instead of the simulation line.
exten => 2606,1,NoOp(CrunchWhistle: WOPR calls back after a win)
 same => n,Answer()
 same => n,Set(REC=${RECDIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}-win)
 same => n,MixMonitor(${REC}.wav,r(${REC}-caller.wav))
 same => n,AudioSocket(ca11bac1-0000-4000-8000-000000000000,${WOPR_HOSTPORT})
 same => n,Hangup()

; scratch extensions for bringing up the ATA
exten => 2601,1,NoOp(echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 2602,1,NoOp(milliwatt test tone)
 same => n,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

; 2603 records 30 s of handset audio to /tmp/handset.wav for detector tuning (harness.py play)
exten => 2603,1,NoOp(record handset)
 same => n,Answer()
 same => n,Record(/tmp/handset.wav,,30,k)
 same => n,Hangup()
